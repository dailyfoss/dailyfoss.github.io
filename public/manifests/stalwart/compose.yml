services:
  mail-server:
    container_name: stalwart-mail
    image: stalwartlabs/mail-server:latest
    tty: true
    stdin_open: true
    ports:
      - 443:443
      - 8080:8080
      - 25:25
      - 587:587
      - 465:465
      - 143:143
      - 993:993
      - 4190:4190
      - 110:110
      - 995:995
    volumes:
      - :/opt/stalwart-mail
    restart: always